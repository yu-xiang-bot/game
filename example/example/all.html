<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>星云守护 - 塔防游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }

        /* 星空背景动画 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent);
            background-size: 200% 200%;
            animation: starsAnimation 120s linear infinite;
            opacity: 0.3;
            z-index: 1;
        }

        @keyframes starsAnimation {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-50px, -50px) rotate(360deg); }
        }

        /* 游戏容器 */
        #mouted {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
        }

        /* 加载动画 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }

        .loading-title {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 40px rgba(100, 149, 237, 0.8),
                         0 0 60px rgba(100, 149, 237, 0.6);
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-subtitle {
            font-size: 1.2rem;
            color: #a8b2d1;
            margin-bottom: 40px;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
        }

        .loading-progress {
            margin-top: 30px;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(100, 149, 237, 0.8), 0 0 60px rgba(100, 149, 237, 0.6); }
            to { text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 50px rgba(100, 149, 237, 1), 0 0 70px rgba(100, 149, 237, 0.8); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes progress {
            0% { width: 0%; left: 0; }
            50% { width: 70%; left: 0; }
            100% { width: 100%; left: 0; }
        }

        /* 版本信息 */
        .version-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 性能指示器 */
        .performance-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .loading-title {
                font-size: 2.5rem;
            }
            .loading-subtitle {
                font-size: 1rem;
            }
            .version-info {
                bottom: 10px;
                right: 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- 加载画面 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-title">星云守护</div>
        <div class="loading-subtitle">NEBULA GUARDIAN</div>
        <div class="loading-spinner"></div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>

    <!-- 游戏容器 -->
    <div id='mouted'></div>
    
    <!-- 版本信息 -->
    <div class="version-info">
        v1.0.0 | Development Mode
    </div>

    <!-- 性能指示器 (开发模式) -->
    <div class="performance-indicator" id="fpsCounter" style="display: none;">
        FPS: <span id="fpsValue">60</span>
    </div>

    <script>
        // 加载画面管理
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 1000);
                }
            }, 2000); // 2秒后隐藏加载画面
        });

        // FPS计数器 (开发模式)
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            const fpsCounter = document.getElementById('fpsCounter');
            const fpsValue = document.getElementById('fpsValue');
            
            fpsCounter.style.display = 'block';
            
            let lastTime = performance.now();
            let fps = 60;
            
            function updateFPS() {
                const currentTime = performance.now();
                fps = Math.round(1000 / (currentTime - lastTime));
                lastTime = currentTime;
                
                fpsValue.textContent = fps;
                
                // 根据FPS改变颜色
                if (fps >= 50) {
                    fpsValue.style.color = '#00ff00';
                } else if (fps >= 30) {
                    fpsValue.style.color = '#ffff00';
                } else {
                    fpsValue.style.color = '#ff0000';
                }
                
                requestAnimationFrame(updateFPS);
            }
            
            requestAnimationFrame(updateFPS);
        }

        // 防止右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // 全屏功能支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        // 添加页面可见性API支持
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                document.title = '星云守护 - 暂停中';
            } else {
                document.title = '星云守护 - 塔防游戏';
            }
        });
    </script>
</body>
</html>
